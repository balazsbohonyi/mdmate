[package]
name = "mdmate"
version = "0.1.0"
description = "A fast inline Markdown editor"
authors = ["Balazs Bohonyi"]
license = "MIT"
repository = "https://github.com/balazsbohonyi/mdmate"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mdmate_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6", "gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[features]
# Compiles the perf-harness commands and the asset protocol they test. Only `pnpm perf` turns this
# on; shipped builds leave it off.
perf = ["tauri/protocol-asset"]

[lints.rust]
unsafe_code = "deny" # platform/ modules opt in locally

[lints.clippy]
unwrap_used = "deny"
print_stdout = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
await_holding_lock = "deny"

# panic stays "unwind", so a crashed background thread can't lose unsaved typing.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3"
